name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of requests or code that triggers the bug.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `quiver --version`, or the crate / Python package version.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Server (REST), Server (gRPC), Rust library, Storage engines, Snapshots, Terminal UI, Python client, Rust client, Docker image, Docs]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
