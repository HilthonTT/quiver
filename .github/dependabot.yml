version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /clients/python
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tags are Rust versions (we pin the MSRV, 1.89), not releases of the action.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
