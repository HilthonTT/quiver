syntax = "proto3";

// Quiver gRPC API, v1.
//
// Mirrors the REST API (docs/API.md). Metadata and filters are carried as
// JSON strings so arbitrary nested documents round-trip losslessly.
//
// Authentication: send `authorization: Bearer <key>` (or `x-api-key: <key>`)
// metadata. Read-only keys may call every read RPC; writes need read-write keys.
package quiver.v1;

service Quiver {
  rpc Health(HealthRequest) returns (HealthResponse);
  // Server-wide statistics.
  rpc Info(InfoRequest) returns (InfoResponse);

  // Collections
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (CollectionInfo);
  rpc GetCollection(GetCollectionRequest) returns (CollectionInfo);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc Compact(CompactRequest) returns (CollectionInfo);
  // Indexes a metadata field so filters on it scan matching points only.
  rpc CreateFieldIndex(FieldIndexRequest) returns (CollectionInfo);
  rpc DropFieldIndex(FieldIndexRequest) returns (CollectionInfo);
  // Changes index, quantization or on-disk settings; may rebuild indexes.
  rpc UpdateCollection(UpdateCollectionRequest) returns (CollectionInfo);
  // Renames a collection; its aliases follow it.
  rpc RenameCollection(RenameCollectionRequest) returns (CollectionInfo);

  // Aliases: alternative names for collections, usable wherever a
  // collection is named except DropCollection and RenameCollection.
  rpc ListAliases(ListAliasesRequest) returns (ListAliasesResponse);
  // Creates an alias, or atomically points it at another collection.
  rpc SetAlias(SetAliasRequest) returns (SetAliasResponse);
  rpc DeleteAlias(DeleteAliasRequest) returns (DeleteAliasResponse);

  // Points
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc GetPoints(GetPointsRequest) returns (GetPointsResponse);
  rpc DeletePoints(DeletePointsRequest) returns (DeletePointsResponse);
  rpc Scroll(ScrollRequest) returns (ScrollResponse);
  rpc Count(CountRequest) returns (CountResponse);
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);

  // Search
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc SearchBatch(SearchBatchRequest) returns (SearchBatchResponse);
  rpc Recommend(RecommendRequest) returns (SearchResponse);
  // Hybrid search: several dense and sparse searches fused into one ranking.
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc SearchGroups(SearchGroupsRequest) returns (SearchGroupsResponse);
  rpc Discover(DiscoverRequest) returns (SearchResponse);
  rpc Facet(FacetRequest) returns (FacetResponse);

  // Snapshots
  rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotInfo);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (SnapshotInfo);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (CollectionInfo);
  // Streams the archive (.tar.gz) in chunks.
  rpc DownloadSnapshot(DownloadSnapshotRequest) returns (stream SnapshotChunk);
  // Adds an archive, sent in chunks, to the registry. Needs a read-write key.
  rpc UploadSnapshot(stream SnapshotChunk) returns (SnapshotInfo);
}

enum Quantization {
  QUANTIZATION_NONE = 0;
  // 8-bit scalar quantization: about a quarter of the memory, lossy.
  QUANTIZATION_SCALAR = 1;
  // 1 bit per component, searched instead of the vectors, which are kept
  // exactly and re-rank the results. Pair with on_disk to save memory.
  QUANTIZATION_BINARY = 2;
}

// Lets points expire once the Unix time (seconds) in a metadata field has passed.
message ExpiryConfig {
  // The metadata field (dot-separated path) holding each point's expiry time.
  string field = 1;
  // Points written without the field get it set to the write time plus this
  // many seconds; unset means such points never expire.
  optional uint64 default_ttl = 2;
}

enum Metric {
  METRIC_UNSPECIFIED = 0; // defaults to cosine
  METRIC_COSINE = 1;
  METRIC_EUCLIDEAN = 2;
  METRIC_DOT_PRODUCT = 3;
  METRIC_MANHATTAN = 4;
  METRIC_HAMMING = 5;
}

message FlatIndex {}

message HnswIndex {
  optional uint32 m = 1;
  optional uint32 ef_construction = 2;
  optional uint32 ef_search = 3;
  optional uint64 seed = 4;
}

message KdTreeIndex {
  optional uint32 balance_factor = 1;
}

// Unset defaults to HNSW with default parameters.
message IndexConfig {
  oneof kind {
    FlatIndex flat = 1;
    HnswIndex hnsw = 2;
    KdTreeIndex kd_tree = 3;
  }
}

// Settings of a named dense vector.
message VectorParams {
  uint32 dimension = 1;
  Metric metric = 2;
  IndexConfig index = 3;
  Quantization quantization = 4;
  // Keep the vectors in a file rather than memory (durable engines only).
  bool on_disk = 5;
}

enum SparseModifier {
  // Scores are plain dot products.
  SPARSE_MODIFIER_NONE = 0;
  // Query weights are multiplied by inverse document frequencies (BM25-style).
  SPARSE_MODIFIER_IDF = 1;
}

// Settings of a named sparse vector.
message SparseVectorParams {
  SparseModifier modifier = 1;
}

message DenseVector {
  repeated float values = 1;
}

// Non-zero components: `values[i]` at `indices[i]`.
message SparseVector {
  repeated uint32 indices = 1;
  repeated float values = 2;
}

message CollectionInfo {
  string name = 1;
  uint32 dimension = 2;
  Metric metric = 3;
  IndexConfig index = 4;
  uint64 count = 5;
  uint64 tombstones = 6;
  // Indexed metadata fields.
  repeated string field_indexes = 7;
  Quantization quantization = 8;
  // The main vectors are kept on disk.
  bool on_disk = 9;
  // Named dense vectors every point carries.
  map<string, VectorParams> vectors = 10;
  // Named sparse vectors points may carry.
  map<string, SparseVectorParams> sparse_vectors = 11;
  // Unset when points do not expire.
  ExpiryConfig expiry = 12;
}

message Point {
  // Optional on upsert: a UUID is generated when empty.
  string id = 1;
  repeated float vector = 2;
  // JSON object; empty means no metadata.
  string metadata_json = 3;
  // Every named dense vector of the collection.
  map<string, DenseVector> vectors = 4;
  // Any of the collection's sparse vectors.
  map<string, SparseVector> sparse_vectors = 5;
}

message SearchHit {
  string id = 1;
  float distance = 2;
  string metadata_json = 3;
  repeated float vector = 4;
  map<string, DenseVector> vectors = 5;
  map<string, SparseVector> sparse_vectors = 6;
}

message SnapshotInfo {
  string id = 1;
  string collection = 2;
  uint64 created_at_ms = 3;
  string quiver_version = 4;
  uint32 dimension = 5;
  Metric metric = 6;
  IndexConfig index = 7;
  uint64 points = 8;
  uint64 data_bytes = 9;
  string data_sha256 = 10;
  uint64 archive_bytes = 11;
  repeated string field_indexes = 12;
  Quantization quantization = 13;
  bool on_disk = 14;
  map<string, VectorParams> vectors = 15;
  map<string, SparseVectorParams> sparse_vectors = 16;
  ExpiryConfig expiry = 17;
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
  string version = 2;
}

message InfoRequest {}
message InfoResponse {
  string version = 1;
  // Storage engine for new collections: "file", "rocksdb" or "memory".
  string storage = 2;
  bool snapshots_enabled = 3;
  uint64 collections = 4;
  uint64 points = 5;
}

message ListCollectionsRequest {}
message ListCollectionsResponse {
  repeated CollectionInfo collections = 1;
}

message CreateCollectionRequest {
  string name = 1;
  uint32 dimension = 2;
  Metric metric = 3;
  IndexConfig index = 4;
  // Metadata fields to index from the start.
  repeated string field_indexes = 5;
  Quantization quantization = 6;
  // Keep the main vectors in a file rather than memory.
  bool on_disk = 7;
  map<string, VectorParams> vectors = 8;
  map<string, SparseVectorParams> sparse_vectors = 9;
  // Unset: points never expire.
  ExpiryConfig expiry = 10;
}

message UpdateCollectionRequest {
  string name = 1;
  // The changes, as JSON in the shape of the REST API's
  // `PATCH /collections/{name}` body, e.g. `{"index": {"ef_search": 128}}`,
  // `{"expiry": {"field": "expires_at"}}`, or `{"expiry": null}` to turn expiry off.
  string update_json = 2;
}

message RenameCollectionRequest {
  // The collection's own name (not an alias).
  string name = 1;
  string new_name = 2;
}

message Alias {
  string alias = 1;
  string collection = 2;
}

message ListAliasesRequest {}
message ListAliasesResponse {
  repeated Alias aliases = 1;
}

message SetAliasRequest {
  string alias = 1;
  string collection = 2;
}
message SetAliasResponse {}

message DeleteAliasRequest {
  string alias = 1;
}
message DeleteAliasResponse {}

// A metadata field, as a dot-separated path like in filters.
message FieldIndexRequest {
  string collection = 1;
  string field = 2;
}

message GetCollectionRequest {
  string name = 1;
}

message DropCollectionRequest {
  string name = 1;
}
message DropCollectionResponse {}

message FlushRequest {
  string collection = 1;
}
message FlushResponse {}

message CompactRequest {
  string collection = 1;
}

message UpsertRequest {
  string collection = 1;
  repeated Point points = 2;
}
message UpsertResponse {
  uint64 upserted = 1;
  repeated string ids = 2;
}

message GetPointsRequest {
  string collection = 1;
  repeated string ids = 2;
  bool with_vectors = 3;
}
message GetPointsResponse {
  repeated Point points = 1;
}

// Give either `ids` or `filter_json`, not both.
message DeletePointsRequest {
  string collection = 1;
  repeated string ids = 2;
  // JSON filter: deletes every matching point. `{}` is rejected; drop the
  // collection to delete everything.
  string filter_json = 3;
}
message DeletePointsResponse {
  uint64 deleted = 1;
}

// Pages through points in ascending id order.
message ScrollRequest {
  reserved 2;
  reserved "offset";
  string collection = 1;
  // 0 means the default (100).
  uint32 limit = 3;
  bool with_vectors = 4;
  // Exclusive: start after this id. Empty means from the start.
  string cursor = 5;
  string filter_json = 6;
  OrderBy order_by = 7;
}

enum Direction {
  DIRECTION_ASC = 0;
  DIRECTION_DESC = 1;
}

message OrderBy {
  string field = 1;
  Direction direction = 2;
}
message ScrollResponse {
  reserved 2;
  reserved "next_offset";
  repeated Point points = 1;
  // Pass as the next `cursor`; unset when there are no further points.
  optional string next_cursor = 3;
}

// Give exactly one of `vector`, `id` and `sparse`.
message SearchRequest {
  string collection = 1;
  repeated float vector = 2;
  // 0 means the default (10).
  uint32 k = 3;
  // JSON filter (see docs/API.md); empty means none.
  string filter_json = 4;
  optional uint32 ef = 5;
  bool with_vectors = 6;
  // Defaults to true when unset.
  optional bool with_metadata = 7;
  // Search with this point's vector; the point itself is left out.
  string id = 8;
  // Drop hits farther than this. With HNSW it applies to the approximate top k.
  optional float max_distance = 9;
  // The named vector to search; empty means the main one. Required with `sparse`.
  string using = 10;
  // Search the sparse vector `using` with this. Hits' distances are their
  // negated scores.
  SparseVector sparse = 11;
  uint32 offset = 12;
}
message SearchResponse {
  repeated SearchHit hits = 1;
}

message SearchBatchRequest {
  // Every request must name the same collection.
  repeated SearchRequest searches = 1;
}
message SearchBatchResponse {
  repeated SearchResponse results = 1;
}

// Finds points like the positive examples and unlike the negative ones.
// The examples themselves are left out of the results.
message RecommendRequest {
  string collection = 1;
  // At least one.
  repeated string positive = 2;
  repeated string negative = 3;
  // 0 means the default (10).
  uint32 k = 4;
  string filter_json = 5;
  optional uint32 ef = 6;
  optional float max_distance = 7;
  bool with_vectors = 8;
  // Defaults to true when unset.
  optional bool with_metadata = 9;
  // The named vector to compare; empty means the main one.
  string using = 10;
  uint32 offset = 11;
}

// One search whose ranking a query fuses. Give exactly one of `vector` and `sparse`.
message Prefetch {
  repeated float vector = 1;
  SparseVector sparse = 2;
  // The named vector to search: empty means the main one for `vector`;
  // required for `sparse`.
  string using = 3;
  // How many of its best hits take part; 0 means max(k + offset, 50).
  uint32 limit = 4;
  // Multiplies its contribution to the fused score; defaults to 1.
  optional float weight = 5;
  optional uint32 ef = 6;
  optional float max_distance = 7;
}

// Fuses the rankings of several searches with reciprocal rank fusion: a
// point at rank r (from 1) of a search scores weight / (rrf_k + r) there.
message QueryRequest {
  string collection = 1;
  repeated Prefetch prefetch = 2;
  // 0 means the default (10).
  uint32 k = 3;
  // JSON filter applied to every search; empty means none.
  string filter_json = 4;
  // Defaults to 60.
  optional uint32 rrf_k = 5;
  bool with_vectors = 6;
  // Defaults to true when unset.
  optional bool with_metadata = 7;
  Fusion fusion = 8;
  Rescore rescore = 9;
  uint32 offset = 10;
}

enum Fusion {
  FUSION_RRF = 0;
  FUSION_RELATIVE_SCORE = 1;
  FUSION_DBSF = 2;
}

message Rescore {
  repeated float vector = 1;
  string using = 2;
}

message SearchGroupsRequest {
  string collection = 1;
  repeated float vector = 2;
  string id = 3;
  SparseVector sparse = 4;
  string using = 5;
  string group_by = 6;
  uint32 groups = 7;
  uint32 group_size = 8;
  string filter_json = 9;
  optional uint32 ef = 10;
  optional float max_distance = 11;
  bool with_vectors = 12;
  optional bool with_metadata = 13;
}

message HitGroup {
  string key_json = 1;
  repeated SearchHit hits = 2;
}

message SearchGroupsResponse {
  repeated HitGroup groups = 1;
}

message Example {
  oneof example {
    string id = 1;
    DenseVector vector = 2;
  }
}

message ContextPair {
  Example positive = 1;
  Example negative = 2;
}

message DiscoverRequest {
  string collection = 1;
  Example target = 2;
  repeated ContextPair context = 3;
  string using = 4;
  uint32 k = 5;
  uint32 offset = 6;
  string filter_json = 7;
  optional uint32 ef = 8;
  optional float max_distance = 9;
  bool with_vectors = 10;
  optional bool with_metadata = 11;
}

message FacetRequest {
  string collection = 1;
  string field = 2;
  string filter_json = 3;
  uint32 limit = 4;
}

message FacetValue {
  string value_json = 1;
  uint64 count = 2;
}

message FacetResponse {
  repeated FacetValue values = 1;
}

message ScoredHit {
  string id = 1;
  // The fused score; higher is better.
  float score = 2;
  string metadata_json = 3;
  repeated float vector = 4;
  map<string, DenseVector> vectors = 5;
  map<string, SparseVector> sparse_vectors = 6;
}

message QueryResponse {
  repeated ScoredHit hits = 1;
}

message CountRequest {
  string collection = 1;
  // JSON filter; empty counts every point.
  string filter_json = 2;
}
message CountResponse {
  uint64 count = 1;
}

enum MetadataMode {
  // RFC 7386 JSON Merge Patch: objects merge and `null` removes a key.
  METADATA_MODE_MERGE = 0;
  // Replace the whole value; `null` removes the metadata.
  METADATA_MODE_REPLACE = 1;
}

// Give either `ids` or `filter_json`, not both.
message UpdateMetadataRequest {
  string collection = 1;
  repeated string ids = 2;
  string filter_json = 3;
  // Required JSON value (`null` is allowed).
  string metadata_json = 4;
  MetadataMode mode = 5;
}
message UpdateMetadataResponse {
  uint64 updated = 1;
}

message CreateSnapshotRequest {
  string collection = 1;
}

message ListSnapshotsRequest {
  // Empty lists every collection's snapshots.
  string collection = 1;
}
message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message GetSnapshotRequest {
  string id = 1;
}

message DeleteSnapshotRequest {
  string id = 1;
}
message DeleteSnapshotResponse {}

message DownloadSnapshotRequest {
  string id = 1;
}

// A piece of a snapshot archive, in order.
message SnapshotChunk {
  bytes data = 1;
}

message RestoreSnapshotRequest {
  string id = 1;
  // Restore under this name instead of the original (empty = original).
  string collection = 2;
  bool replace = 3;
}
