[package]
name = "quiver-server"
description = "Quiver server binary exposing the gRPC and HTTP APIs."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "quiver"
path = "src/main.rs"

[features]
default = []
## Enables the RocksDB storage engine (`--storage rocksdb`).
rocksdb = ["quiver-db/rocksdb"]

[dependencies]
quiver-types.workspace = true
quiver-db.workspace = true
quiver-grpc.workspace = true
quiver-http.workspace = true
tokio.workspace = true
clap.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
