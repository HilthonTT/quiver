[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/HilthonTT/vector-db"
homepage = "https://github.com/HilthonTT/vector-db"
keywords = ["vector", "database", "embeddings", "ann", "search"]
categories = ["database-implementations"]

[workspace.dependencies]
# Internal crates
vectordb-client = { path = "crates/client" }
vectordb-db = { path = "crates/db" }
vectordb-grpc = { path = "crates/grpc" }
vectordb-http = { path = "crates/http" }
vectordb-index = { path = "crates/index" }
vectordb-snapshot = { path = "crates/snapshot" }
vectordb-storage = { path = "crates/storage" }
vectordb-types = { path = "crates/types" }

# External crates
anyhow = "1"
axum = "0.8"
crc32fast = "1.4"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
parking_lot = "0.12"
rayon = "1.12"
rocksdb = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
