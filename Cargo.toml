[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/HilthonTT/quiver"
homepage = "https://github.com/HilthonTT/quiver"
keywords = ["vector", "database", "embeddings", "ann", "search"]
categories = ["database-implementations"]

[workspace.dependencies]
# Internal crates
quiver-client = { path = "crates/client" }
quiver-db = { path = "crates/db" }
quiver-grpc = { path = "crates/grpc" }
quiver-http = { path = "crates/http" }
quiver-index = { path = "crates/index" }
quiver-snapshot = { path = "crates/snapshot" }
quiver-storage = { path = "crates/storage" }
quiver-types = { path = "crates/types" }

# External crates
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1.4"
dotenvy = "0.15"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
parking_lot = "0.12"
prost = "0.14"
protox = "0.10"
ratatui = "0.30"
rayon = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocksdb = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
